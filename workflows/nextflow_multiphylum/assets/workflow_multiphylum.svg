<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">phylaCOI multiphylum Nextflow workflow</title>
  <desc id="desc">Diagram showing phyla processed as independent Nextflow tasks after taxonomic assignment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fff; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .lane-title { font: 700 15px Arial, sans-serif; fill: #334155; }
      .node-title { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 12.5px Arial, sans-serif; fill: #334155; }
      .input { fill: #eef6ff; stroke: #2b6cb0; stroke-width: 1.8; }
      .process { fill: #fff; stroke: #64748b; stroke-width: 1.6; }
      .parallel { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; }
      .metrics { fill: #ecfeff; stroke: #0e7490; stroke-width: 2.1; }
      .analysis { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
      .output { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.7; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.1; marker-end: url(#arrow); }
      .arrow-light { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .caption { font: 700 12px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="820"/>
  <text x="48" y="52" class="title">phylaCOI multiphylum Nextflow workflow</text>
  <text x="48" y="78" class="subtitle">Each phylum becomes an independent task for abundance estimation, OTU generation, informative OTU selection, and OTU metrics.</text>

  <rect x="50" y="115" width="1180" height="118" rx="18" class="lane"/>
  <text x="70" y="142" class="lane-title">Shared preprocessing</text>

  <rect x="95" y="160" width="220" height="54" rx="13" class="input" filter="url(#shadow)"/>
  <text x="117" y="182" class="node-title">Raw inputs</text>
  <text x="117" y="202" class="node-text">FASTA, DB, metadata</text>

  <rect x="405" y="153" width="230" height="68" rx="13" class="process" filter="url(#shadow)"/>
  <text x="427" y="178" class="node-title">RAW_PREPROCESS</text>
  <text x="427" y="199" class="node-text">clean FASTA and headers</text>

  <rect x="725" y="153" width="245" height="68" rx="13" class="process" filter="url(#shadow)"/>
  <text x="747" y="178" class="node-title">VSEARCH_TAXONOMY</text>
  <text x="747" y="199" class="node-text">split sequences by phylum</text>

  <rect x="1045" y="160" width="145" height="54" rx="13" class="output" filter="url(#shadow)"/>
  <text x="1067" y="182" class="node-title">Phylum dirs</text>
  <text x="1067" y="202" class="node-text">vsearch_results/</text>

  <path class="arrow" d="M 315 187 L 398 187"/>
  <path class="arrow" d="M 635 187 L 718 187"/>
  <path class="arrow" d="M 970 187 L 1038 187"/>

  <rect x="50" y="272" width="1180" height="258" rx="18" class="lane"/>
  <text x="70" y="300" class="lane-title">Parallel phylum tasks</text>

  <rect x="95" y="326" width="210" height="154" rx="16" class="parallel" filter="url(#shadow)"/>
  <text x="118" y="354" class="node-title">Phylum A</text>
  <text x="118" y="380" class="node-text">ABUNDANCE_ONE</text>
  <text x="118" y="401" class="node-text">OTU_GENERATION_ONE</text>
  <text x="118" y="422" class="node-text">INFORMATIVE_OTUS_ONE</text>
  <text x="118" y="443" class="node-text">OTU_METRICS_ONE</text>

  <rect x="385" y="326" width="210" height="154" rx="16" class="parallel" filter="url(#shadow)"/>
  <text x="408" y="354" class="node-title">Phylum B</text>
  <text x="408" y="380" class="node-text">ABUNDANCE_ONE</text>
  <text x="408" y="401" class="node-text">OTU_GENERATION_ONE</text>
  <text x="408" y="422" class="node-text">INFORMATIVE_OTUS_ONE</text>
  <text x="408" y="443" class="node-text">OTU_METRICS_ONE</text>

  <rect x="675" y="326" width="210" height="154" rx="16" class="parallel" filter="url(#shadow)"/>
  <text x="698" y="354" class="node-title">Phylum C</text>
  <text x="698" y="380" class="node-text">ABUNDANCE_ONE</text>
  <text x="698" y="401" class="node-text">OTU_GENERATION_ONE</text>
  <text x="698" y="422" class="node-text">INFORMATIVE_OTUS_ONE</text>
  <text x="698" y="443" class="node-text">OTU_METRICS_ONE</text>

  <rect x="965" y="326" width="210" height="154" rx="16" class="parallel" filter="url(#shadow)"/>
  <text x="988" y="354" class="node-title">Phylum N</text>
  <text x="988" y="380" class="node-text">ABUNDANCE_ONE</text>
  <text x="988" y="401" class="node-text">OTU_GENERATION_ONE</text>
  <text x="988" y="422" class="node-text">INFORMATIVE_OTUS_ONE</text>
  <text x="988" y="443" class="node-text">OTU_METRICS_ONE</text>

  <text x="486" y="505" class="caption">Number of simultaneous phyla controlled by max_parallel_phyla</text>

  <path class="arrow-light" d="M 1118 214 C 1118 260 200 270 200 318"/>
  <path class="arrow-light" d="M 1118 214 C 1118 260 490 270 490 318"/>
  <path class="arrow-light" d="M 1118 214 C 1118 260 780 270 780 318"/>
  <path class="arrow-light" d="M 1118 214 C 1118 260 1070 270 1070 318"/>

  <rect x="50" y="570" width="1180" height="190" rx="18" class="lane"/>
  <text x="70" y="598" class="lane-title">Global outputs and downstream analyses</text>

  <rect x="95" y="635" width="235" height="68" rx="13" class="metrics" filter="url(#shadow)"/>
  <text x="117" y="660" class="node-title">COMBINE_OTU_METRICS</text>
  <text x="117" y="681" class="node-text">write master metrics CSV</text>

  <rect x="425" y="630" width="235" height="78" rx="13" class="analysis" filter="url(#shadow)"/>
  <text x="447" y="655" class="node-title">METRICS_ANALYSIS</text>
  <text x="447" y="676" class="node-text">models, correlations,</text>
  <text x="447" y="693" class="node-text">predictions, figures</text>

  <rect x="750" y="630" width="235" height="78" rx="13" class="analysis" filter="url(#shadow)"/>
  <text x="772" y="655" class="node-title">HAPLOTYPE_CLUSTERING_ALL</text>
  <text x="772" y="676" class="node-text">all haplotype connections</text>
  <text x="772" y="693" class="node-text">locality clustering</text>

  <rect x="1015" y="630" width="180" height="78" rx="13" class="analysis" filter="url(#shadow)"/>
  <text x="1037" y="655" class="node-title">SAME_DIFF</text>
  <text x="1037" y="676" class="node-text">same vs different</text>
  <text x="1037" y="693" class="node-text">haplotype currents</text>

  <path class="arrow" d="M 200 480 C 200 550 212 575 212 628"/>
  <path class="arrow" d="M 490 480 C 490 545 235 570 235 628"/>
  <path class="arrow" d="M 780 480 C 780 545 260 570 260 628"/>
  <path class="arrow" d="M 1070 480 C 1070 545 285 570 285 628"/>
  <path class="arrow" d="M 330 669 L 418 669"/>
  <path class="arrow" d="M 330 669 C 560 760 760 742 842 713"/>
  <path class="arrow" d="M 985 669 L 1008 669"/>

  <rect x="425" y="725" width="235" height="38" rx="10" class="output"/>
  <text x="447" y="749" class="node-text">otu_metrics_summary/</text>

  <rect x="750" y="725" width="235" height="38" rx="10" class="output"/>
  <text x="772" y="749" class="node-text">all_haplotypes/</text>

  <rect x="1015" y="725" width="180" height="38" rx="10" class="output"/>
  <text x="1037" y="749" class="node-text">same_vs_diff_currents/</text>
</svg>
